
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master | Day 04</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header>
            <h1>Quiz Master</h1>
            <p>Test your knowledge and challenge yourself!</p>
        </header>

        <main class="quiz-box" id="quiz-box">

            <div class="quiz-top">
                <span id="question-number">Question 1 of 5</span>
                <span id="score">Score: 0</span>
            </div>

            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <h2 id="question">Question will appear here</h2>

            <div class="options" id="options">
                <!-- Options will be added using JavaScript -->
            </div>

            <p id="feedback"></p>

            <button id="next-btn" disabled>Next Question</button>

        </main>

        <section class="result-box" id="result-box">
            <h2>Quiz Completed!</h2>
            <p id="final-score"></p>
            <p id="result-message"></p>
            <button id="restart-btn">Restart Quiz</button>
        </section>

        <footer>
            <p>Frontend Day 04 Project | Built with HTML, CSS & JavaScript</p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
